<style>
:root{--g:#1F5E2B;--ink:#17261B;--mut:#55655A;--line:#D5DFD2;--bg:#EAEFE7;--card:#fff;--tint:#E1F0DB;--soft:#F1F5EE;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;height:100vh;height:100dvh}
.list{width:420px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.detail{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.head{padding:24px 24px 14px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;border-radius:13px;background:var(--g);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand h1{margin:0;font-size:24px;line-height:1.1;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.langbtn{margin-left:auto;min-height:44px;min-width:76px;padding:0 10px;border-radius:10px;border:1px solid #C3D0BF;background:#fff;font-size:13px;color:var(--mut)}
.langbtn b{color:var(--g)}
.prog{display:flex;flex-direction:column;gap:8px}
.prog-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.prog-top b{color:var(--g)}
.bar{height:8px;border-radius:4px;background:#E3EBDF;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:4px;transition:width .3s}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px}
.search:focus-within{border-color:var(--g)}
.rows{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 8px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-radius:12px;border:1px solid transparent;background:var(--card);text-align:left;width:100%}
.row:hover{background:var(--soft)}
.row.sel{background:#EAF3E5;border-color:#9CC48F}
.num{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#EEF1EC;color:var(--mut)}
.sel .num,.row.nowr .num{background:var(--g);color:#fff}
.row.done .num{background:var(--tint);color:var(--g)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt b{font-size:14px;font-weight:600;line-height:1.25}
.rt span{font-size:12px;color:var(--mut)}
.chip{flex-shrink:0;font-size:12px;font-weight:600;padding:4px 10px;border-radius:10px;background:#EEF1EC;color:var(--mut)}
.chip.done{background:#E1F0DB;color:var(--g)}
.chip.now{background:#FDF0D5;color:#7A4A06}
.chip.has{background:var(--soft);color:var(--g);border:1px solid #C3D0BF}
.foot{padding:10px 20px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #E3EBDF;display:flex;flex-direction:column;gap:8px}
.foot .tools{display:flex;gap:8px;flex-wrap:wrap}
.foot .tools button,.ownbtn{flex:1 1 40%;min-height:44px;border-radius:10px;border:1px solid #C3D0BF;background:#fff;font-size:12px;font-weight:600}
.ownbtn{width:100%}
.own{display:flex;flex-direction:column;gap:6px}
.note{font-size:12px;color:var(--mut);line-height:1.4}
.note.ok{color:var(--g);font-weight:600}
.foot small{font-size:12px;color:var(--mut);text-align:center}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:20px 28px 16px;display:flex;align-items:center;gap:16px}
.top .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g)}
.top h2{margin:0;font-size:24px;letter-spacing:-.01em;line-height:1.2}
.top p{margin:0;font-size:14px;color:var(--mut)}
.icon-btn{width:48px;height:48px;border-radius:14px;border:1px solid #C3D0BF;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.back{display:none;border:0;background:transparent;border-radius:24px}
.primary{height:48px;padding:0 20px;border-radius:14px;border:0;background:var(--g);color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.primary.off{background:#fff;color:var(--g);border:1px solid var(--g)}
.primary[disabled]{opacity:.6;cursor:default}
.tabs{padding:14px 28px 0;display:flex;gap:8px;flex-wrap:wrap}
.tab{height:44px;padding:0 18px;border-radius:22px;border:1px solid #C3D0BF;background:#fff;font-size:14px;font-weight:600}
.tab.on{background:var(--g);border-color:var(--g);color:#fff}
.tab.add{border-style:dashed;color:var(--g)}
.stage{flex:1;min-height:0;padding:16px 28px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.frame{flex:1;min-height:0;border:1px solid #C3D0BF;border-radius:14px;background:#fff;width:100%}
.stage-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.stage-bar a,.stage-bar button{height:44px;padding:0 14px;border-radius:12px;border:1px solid #C3D0BF;background:#fff;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;display:flex;align-items:center}
.stage-bar .danger{color:#9A2A2A}
.card{max-width:560px;margin:auto;width:100%;background:#fff;border:1px solid #C3D0BF;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.card h3{margin:0;font-size:18px}
.card h4{margin:6px 0 0;font-size:14px}
.card p{margin:0;font-size:14px;color:var(--mut);line-height:1.5}
.card hr{border:0;border-top:1px solid #E3EBDF;margin:2px 0;width:100%}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.field input{height:48px;border-radius:12px;border:1px solid #C3D0BF;padding:0 14px;font-size:14px;font-weight:400;background:#fff}
.field input[type=file]{padding:10px 14px;height:auto}
.field input:focus{outline:2px solid var(--g);outline-offset:1px}
.err{font-size:13px;color:#9A2A2A;min-height:18px}
.bottom{display:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.bottom .primary{width:100%;height:52px}
@media (max-width:899px){
  .list{width:100%;border-right:0}
  .app:not(.show-detail) .detail{display:none}
  .app.show-detail .list{display:none}
  .back{display:flex}
  .top{padding:12px 8px 12px 4px;gap:4px}
  .top h2{font-size:18px}
  .top p{display:none}
  .top .primary{display:none}
  .icon-btn{border:0;background:transparent}
  .tabs{padding:12px 16px 0}
  .tab{height:44px;padding:0 14px;font-size:13px}
  .stage{padding:12px 16px}
  .bottom{display:block}
}
</style>
</head>

  if(S.done[n])return[t('stDone'),'done'];
  if(S.last===n)return[t('stNow'),'now'];
  if(linksOf(n).length)return[t('stHas'),'has'];
  return[t('stNone'),''];
}
function normIndex(j){
  var out={links:{}};
  if(j&&typeof j.links==='object'){
    Object.keys(j.links).forEach(function(k){
      var a=j.links[k];
      if(Array.isArray(a))out.links[k]=a.filter(function(l){return l&&l.id;}).map(function(l){return{label:String(l.label||'Fail'),id:String(l.id)};});
    });
  }
  return out;
}

/* ---------- Drive: baca indeks (penonton guna API key, pemilik guna token) ---------- */
function loadRemote(){
  if(!S.indexId)return Promise.resolve();
  var url='https://www.googleapis.com/drive/v3/files/'+S.indexId+'?alt=media';
  var req;
  if(token){req=fetch(url,{cache:'no-store',headers:{Authorization:'Bearer '+token}});}
  else if(CFG.API_KEY){req=fetch(url+'&key='+encodeURIComponent(CFG.API_KEY),{cache:'no-store'});}
  else return Promise.resolve();
  return req.then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(j){remote=normIndex(j);renderList();renderDetail();})
    .catch(function(){msg=t('indexFail');renderOwner();});
}

/* ---------- Log masuk Google (pemilik sahaja) ---------- */
function loadGsi(cb){
  if(window.google&&google.accounts&&google.accounts.oauth2)return cb();
  var s=document.createElement('script');
  s.src='https://accounts.google.com/gsi/client';
  s.onload=cb;
  s.onerror=function(){msg=t('gsiFail');renderOwner();};
  document.head.appendChild(s);
}
function getToken(interactive){
  return new Promise(function(res,rej){
    if(token&&Date.now()<tokenExp-60000)return res(token);
    if(!CFG.CLIENT_ID)return rej(new Error(t('noClient')));
    loadGsi(function(){
      if(!tc){
        tc=google.accounts.oauth2.initTokenClient({
          client_id:CFG.CLIENT_ID,
          scope:'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email',
          callback:function(r){
            if(r.error){tc._rej(new Error(r.error));return;}
            token=r.access_token;tokenExp=Date.now()+(r.expires_in||3600)*1000;tc._res(token);
          },
          error_callback:function(e){tc._rej(new Error((e&&e.type)||t('cancelled')));}
        });
      }
      tc._res=res;tc._rej=rej;
      tc.requestAccessToken({prompt:interactive?'select_account':''});
    });
  });
}
function gfetch(url,opts){
  opts=opts||{};
  opts.headers=Object.assign({Authorization:'Bearer '+token},opts.headers||{});
  return fetch(url,opts).then(function(r){
    if(!r.ok)throw new Error('Drive '+r.status);
    return r.json();
  });
}
function findOne(q){
  return gfetch('https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id,name)&q='+encodeURIComponent(q))
    .then(function(j){return(j.files&&j.files[0])||null;});
}
function makePublic(id){
  return gfetch('https://www.googleapis.com/drive/v3/files/'+id+'/permissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'reader',type:'anyone'})});
}
function createIndexFile(){
  var b='nh'+Date.now();
  var body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:'nota-haji-index.json',parents:[folderId],mimeType:'application/json'})+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify({v:1,links:{}})+'\r\n--'+b+'--';
  return gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:body})
    .then(function(f){return makePublic(f.id).then(function(){return f;});});
}
function ensureSetup(){
  return findOne("name='Nota Haji (app)' and mimeType='application/vnd.google-apps.folder' and trashed=false").then(function(f){
    if(f)return f;
    return gfetch('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Nota Haji (app)',mimeType:'application/vnd.google-apps.folder'})});
  }).then(function(f){
    folderId=f.id;
    return findOne("name='nota-haji-index.json' and trashed=false");
  }).then(function(ix){
    return ix||createIndexFile();
  }).then(function(ix){
    S.indexId=ix.id;save();
    return loadRemote();
  });
}
function pushIndex(){
  return gfetch('https://www.googleapis.com/upload/drive/v3/files/'+S.indexId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({v:1,links:remote.links})});
}
function signIn(){
  msg=t('connecting');renderOwner();
  getToken(true).then(function(t){
    return fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+t}}).then(function(r){return r.json();});
  }).then(function(u){
    if(!u.email||u.email.toLowerCase()!==OWNER){
      try{google.accounts.oauth2.revoke(token,function(){});}catch(e){}
      token=null;owner=false;
      msg=t('notOwner',OWNER);
      renderOwner();renderDetail();
      return null;
    }
    owner=true;msg=t('setupFolder');renderOwner();
    return ensureSetup().then(function(){msg='';renderOwner();renderList();renderDetail();});
  }).catch(function(e){
    owner=false;token=null;
    msg=t('signFail',(e&&e.message?e.message:t('unknown')));
    renderOwner();
  });
}
function uploadPdf(file){
  return getToken(false).then(function(t){
    return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id',{
      method:'POST',
      headers:{Authorization:'Bearer '+t,'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':'application/pdf'},
      body:JSON.stringify({name:file.name,parents:[folderId],mimeType:'application/pdf'})
    });
  }).then(function(r){
    if(!r.ok)throw new Error(t('startFail',r.status));
    var loc=r.headers.get('Location');
    if(!loc)throw new Error(t('noAddr'));
    return fetch(loc,{method:'PUT',headers:{'Content-Type':'application/pdf'},body:file});
  }).then(function(r){
    if(!r.ok)throw new Error(t('upFail',r.status));
    return r.json();
  }).then(function(f){
    return makePublic(f.id).then(function(){return f;});
  });
}
function shareLink(){
  if(!S.indexId)return;
  var url=location.origin+location.pathname+'#/s/'+S.indexId;
  function fb(){window.prompt(t('sharePrompt'),url);}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){msg=t('shareCopied');renderOwner();},fb);
  }else fb();
}

/* ---------- Paparan ---------- */
function renderOwner(){
  var box=$('own');
  box.textContent='';
  if(!CFG.CLIENT_ID){return;}
  if(!owner){
    box.appendChild(h('button',{type:'button',class:'ownbtn',onclick:signIn,text:t('ownIn')}));
  }else{
    box.appendChild(h('div',{class:'note ok',text:t('ownOk')}));
    box.appendChild(h('button',{type:'button',class:'ownbtn',onclick:shareLink,text:t('shareBtn')}));
  }
  if(msg)box.appendChild(h('div',{class:'note',role:'status',text:msg}));
}

function renderList(){
  var done=WEEKS.filter(function(w){return S.done[w.n];}).length;
  $('progText').textContent=done+' / 12 '+t('weeks');
  $('progBar').style.width=Math.round(done/12*100)+'%';
  var q=query.trim().toLowerCase();
  var rows=$('rows');
  rows.textContent='';
  var shown=WEEKS.filter(function(w){return !q||(w.f+' '+w.s+' minggu '+w.n).toLowerCase().indexOf(q)>-1;});
  if(!shown.length){rows.appendChild(h('p',{class:'err',style:'padding:12px',text:t('noMatch')}));return;}
  shown.forEach(function(w){
    var st=statusOf(w.n);
    var cls='row'+(sel===w.n&&wide.matches?' sel':'')+(S.done[w.n]?' done':'')+(S.last===w.n&&!S.done[w.n]?' nowr':'');
    rows.appendChild(h('button',{type:'button',class:cls,onclick:function(){go(w.n);}},
      h('div',{class:'num',text:String(w.n)}),
      h('div',{class:'rt'},h('b',{text:w.s}),h('span',{text:t('pages')+w.p+(w.d?' · '+dt(w.d):'')})),
      h('div',{class:'chip '+st[1],text:st[0]})
    ));
  });
}

function markBtn(n,extra){
  var d=!!S.done[n];
  return h('button',{type:'button',class:'primary'+(d?' off':'')+(extra?' '+extra:''),onclick:function(){
    if(S.done[n])delete S.done[n];else S.done[n]=true;
    save();renderList();renderDetail();
  }},svg(ICON.ok,18),d?t('unmark'):t('mark'));
}

function renderDetail(){
  var box=$('detail');
  box.textContent='';
  if(sel===null)return;
  var w=getWeek(sel),links=linksOf(sel);
  if(active>=links.length)active=Math.max(0,links.length-1);
  var cur=links[active];

  box.appendChild(h('div',{class:'top'},
    h('button',{type:'button',class:'icon-btn back','aria-label':t('back'),onclick:function(){go(null);}},svg(ICON.back,24)),
    h('div',{class:'t'},
      h('div',{class:'eyebrow',text:t('week')+w.n+(w.d?' · '+t('cls')+dt(w.d):'')}),
      h('h2',{text:w.s}),
      h('p',{text:w.f})
    ),
    cur?h('a',{class:'icon-btn',href:'https://drive.google.com/uc?export=download&id='+cur.id,target:'_blank',rel:'noopener','aria-label':t('dlPdf'),style:'text-decoration:none;color:inherit'},svg(ICON.dl)):null,
    markBtn(w.n)
  ));

  var tabs=h('div',{class:'tabs'});
  links.forEach(function(l,i){
    tabs.appendChild(h('button',{type:'button',class:'tab'+(i===active&&!adding?' on':''),onclick:function(){active=i;adding=false;renderDetail();}},l.label));
  });
  if(links.length)tabs.appendChild(h('button',{type:'button',class:'tab add'+(adding?' on':''),onclick:function(){adding=true;renderDetail();}},t('addTab')));
  if(links.length)box.appendChild(tabs);

  var stage=h('div',{class:'stage'});
  if(!links.length||adding){
    stage.appendChild(addCard(links.length===0));
  }else{
    stage.appendChild(h('iframe',{class:'frame',src:'https://drive.google.com/file/d/'+cur.id+'/preview',title:cur.label,allow:'fullscreen',loading:'lazy'}));
    var bar=h('div',{class:'stage-bar'},
      h('a',{href:'https://drive.google.com/file/d/'+cur.id+'/view',target:'_blank',rel:'noopener',text:t('openDrive')})
    );
    if(!cur.remote||owner){
      bar.appendChild(h('button',{type:'button',class:'danger',onclick:function(){
        if(!confirm(t('removeConfirm',cur.label)))return;
        if(cur.remote){
          var a=remoteLinks(sel);
          for(var i=0;i<a.length;i++){if(a[i].id===cur.id){a.splice(i,1);break;}}
          pushIndex().catch(function(){msg=t('removeFail');renderOwner();});
        }
        var b=localLinks(sel);
        for(var j=0;j<b.length;j++){if(b[j].id===cur.id){b.splice(j,1);break;}}
        active=0;save();renderList();renderDetail();
      }},t('remove')));
    }
    bar.appendChild(h('span',{text:cur.remote?t('emptyRemote'):t('emptyLocal')}));
    stage.appendChild(bar);
  }
  box.appendChild(stage);
  box.appendChild(h('div',{class:'bottom'},markBtn(w.n)));
}

function addCard(first){
  var link=h('input',{type:'url',id:'lnk',placeholder:'https://drive.google.com/file/d/…',autocomplete:'off'});
  var lab=h('input',{type:'text',id:'lab',placeholder:t('phLabel'),autocomplete:'off',value:t('part')+String.fromCharCode(65+linksOf(sel).length)});
  var err=h('div',{class:'err',role:'alert'});
  var fileIn=h('input',{type:'file',id:'pdf',accept:'application/pdf,.pdf'});
  var upBtn=h('button',{type:'button',class:'primary',text:t('uploadBtn')});

  function addLocal(){
    var v=link.value.trim();
    if(/\/folders\//.test(v)){err.textContent=t('folderErr');return;}
    var id=driveId(v);
    if(!id){err.textContent=t('badLink');return;}
    var l=localLinks(sel);
    l.push({label:lab.value.trim()||(t('fileDef')+(l.length+1)),id:id});
    active=linksOf(sel).length-1;adding=false;S.last=sel;
    save();renderList();renderDetail();
  }
  function doUpload(){
    var f=fileIn.files&&fileIn.files[0];
    if(!f){err.textContent=t('pickPdf');return;}
    if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'){err.textContent=t('mustPdf');return;}
    if(busy)return;
    busy=true;upBtn.disabled=true;upBtn.textContent=t('uploading');err.textContent='';
    var label=lab.value.trim()||f.name.replace(/\.pdf$/i,'');
    var wk=sel;
    uploadPdf(f).then(function(r){
      remoteLinks(wk).push({label:label,id:r.id});
      return pushIndex().then(function(){
        busy=false;active=linksOf(wk).length-1;adding=false;S.last=wk;save();renderList();renderDetail();
      });
    }).catch(function(e){
      busy=false;upBtn.disabled=false;upBtn.textContent=t('uploadBtn');
      err.textContent=t('failCap',(e&&e.message?e.message:t('unknown')));
    });
  }
  upBtn.addEventListener('click',doUpload);

  var card=h('div',{class:'card'},h('h3',{text:first?t('addFirst'):t('addMore')}));
  card.appendChild(h('label',{class:'field'},t('nameField'),lab));
  if(owner){
    card.appendChild(h('p',{text:t('ownP')}));
    card.appendChild(h('label',{class:'field'},t('pdfField'),fileIn));
    card.appendChild(upBtn);
    card.appendChild(h('hr'));
    card.appendChild(h('h4',{text:t('orLink')}));
  }else{
    card.appendChild(h('p',{text:t('linkP')+(CFG.CLIENT_ID?t('linkP2'):'')}));
  }
  card.appendChild(h('label',{class:'field'},t('linkField'),link));
  card.appendChild(err);
  card.appendChild(h('button',{type:'button',class:owner?'tab':'primary',onclick:addLocal},t('saveLink')));
  if(!first)card.appendChild(h('button',{type:'button',class:'tab',onclick:function(){adding=false;renderDetail();}},t('cancel')));
  return card;
}

/* ---------- Laluan ---------- */
function go(n){
  if(n===null){history.pushState(null,'',location.pathname);}
  else{history.pushState(null,'','#/minggu/'+n);}
  route();
}
function route(){
  var sm=location.hash.match(/^#\/s\/([\w-]{10,})/);
  if(sm){
    S.indexId=sm[1];save();
    history.replaceState(null,'',location.pathname);
    loadRemote();
  }
  var m=location.hash.match(/^#\/minggu\/(\d+)/);
  var n=m?parseInt(m[1],10):null;
  if(n!==null&&!getWeek(n))n=null;
  if(n===null&&wide.matches)n=S.last&&getWeek(S.last)?S.last:1;
  if(n!==sel){sel=n;active=0;adding=false;}
  if(sel!==null&&!S.done[sel]&&linksOf(sel).length){S.last=sel;save();}
  $('app').classList.toggle('show-detail',sel!==null);
  renderList();renderDetail();
}
window.addEventListener('popstate',route);
window.addEventListener('hashchange',route);
if(wide.addEventListener)wide.addEventListener('change',route);

function applyStatic(){
  document.documentElement.lang=L()==='en'?'en':'ms';
  $('sub').textContent=t('sub');$('progLabel').textContent=t('progLabel');
  $('q').placeholder=t('ph');$('q').setAttribute('aria-label',t('ph'));
  $('exp').textContent=t('exp');$('imp').textContent=t('imp');$('dl').textContent=t('dl');$('up').textContent=t('up');
  var b=$('lang');b.textContent='';
  var en=L()==='en';
  var a=document.createElement(en?'span':'b');a.textContent='BM';
  var c=document.createElement(en?'b':'span');c.textContent='EN';
  b.appendChild(a);b.appendChild(document.createTextNode(' | '));b.appendChild(c);
}
$('lang').addEventListener('click',function(){
  S.lang=L()==='en'?'ms':'en';save();
  applyStatic();renderOwner();renderList();renderDetail();
});
$('q').addEventListener('input',function(e){query=e.target.value;renderList();});

$('exp').addEventListener('click',function(){
  var code=btoa(unescape(encodeURIComponent(JSON.stringify({links:S.links,done:S.done,indexId:S.indexId}))));
  function fallback(){window.prompt(t('codeSalin'),code);}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(function(){alert(t('codeCopied'));},fallback);
  }else fallback();
});
function applyBackup(o){
  if(!o||typeof o.links!=='object')throw new Error('x');
  Object.keys(o.links).forEach(function(k){
    var cur=localLinks(k);
    (o.links[k]||[]).forEach(function(l){
      if(l&&l.id&&!cur.some(function(c){return c.id===l.id;}))cur.push({label:String(l.label||'Fail'),id:String(l.id)});
    });
  });
  Object.keys(o.done||{}).forEach(function(k){S.done[k]=true;});
  if(o.indexId&&!S.indexId){S.indexId=String(o.indexId);}
  save();route();loadRemote();
}
$('imp').addEventListener('click',function(){
  var code=window.prompt(t('codePaste'));
  if(!code)return;
  try{
    applyBackup(JSON.parse(decodeURIComponent(escape(atob(code.trim())))));
    alert(t('merged'));
  }catch(e){alert(t('badCode'));}
});
$('dl').addEventListener('click',function(){
  var d=new Date(),pad=function(x){return (x<10?'0':'')+x;};
  var name='nota-haji-sandaran-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json';
  var blob=new Blob([JSON.stringify({app:'nota-haji',links:S.links,done:S.done,indexId:S.indexId},null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
});
$('up').addEventListener('click',function(){$('upf').value='';$('upf').click();});
$('upf').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{applyBackup(JSON.parse(r.result));alert(t('restored'));}
    catch(err){alert(t('badBackup'));}
  };
  r.readAsText(f);
});

applyStatic();
renderOwner();
route();
loadRemote();
})();
</script>
